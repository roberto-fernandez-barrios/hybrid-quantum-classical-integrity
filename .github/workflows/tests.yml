name: reproducibility-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install artifact and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Compile auditable workflow modules
        run: >-
          python -m py_compile
          src/qml/statevector_fidelity_kernel.py
          src/experiments/build_q1_gate1_evidence.py
          src/experiments/build_q1_expansion_evidence.py
          src/experiments/run_quantum_integrity_gate.py
          src/experiments/verify_publication_artifact.py
          src/experiments/run_v11_reinforcement_queue.py
          src/experiments/build_q1_reinforcement_evidence.py
          src/experiments/make_q1_reinforcement_figures.py
          src/experiments/assemble_publication_artifact.py
          src/experiments/build_q1_policy_evidence.py
          src/experiments/make_q1_policy_figures.py
          src/experiments/make_q1_policy_tables.py
          src/experiments/make_release_status.py
          src/experiments/run_v13_f5_queue.py
          src/experiments/build_q1_adversarial_evidence.py
          src/experiments/build_v132_amendment_evidence.py
          src/experiments/make_q1_adversarial_figures.py
          src/attacks/cluster_preserving.py
          src/integrity/family_calibration.py
          src/integrity/workflow_state.py
          src/hsaas/policy.py
          src/hsaas/contracts.py
          src/hsaas/demo.py
      - name: Manuscript consistency gates (abstract length, active numbers, claim wording)
        run: python -m pytest -q tests/test_manuscript_consistency.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify publication evidence and SHA-256 contracts
        run: python -m src.experiments.verify_publication_artifact --root publication/artifact
