[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-aegis-audit"
version = "1.3.7"
description = "Information-set conditional integrity auditing for hybrid quantum-classical workflows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "qiskit>=2.1,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-machine-learning>=0.9,<1",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
athena-aegis-demo = "src.hsaas.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
